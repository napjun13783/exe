<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไปดูหนังกันป่าว? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="hearts">
                <span class="heart">❤️</span>
                <span class="heart">💕</span>
                <span class="heart">💗</span>
                <span class="heart">💖</span>
                <span class="heart">💘</span>
            </div>
            
            <h1 class="question">จะไปดูหนังกันไหมมม? 🥺</h1>
            
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWU0ZWJ4eHh6eGZ3eHh6eGZ3eHh6eGZ3eHh6eGZ3eHh6eGZ3eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o6Zt6KHxJTbCO2dHO/giphy.gif" 
                     alt="Cute love gif" 
                     class="love-gif">
            </div>
            
            <div class="button-container">
                <button id="yesBtn" class="btn yes-btn">Yes! 🥰</button>
                <button id="noBtn" class="btn no-btn">No 😢</button>
            </div>
            
            <div id="message" class="message hidden">
                <h2>รู้อยู่แล้วว่าเธอต้องตอบตกลง! 🎉💑</h2>
                <p>ไว้เจอกันวันเดทนะ! 💕</p>
                <div class="floating-hearts">
                    <span>💖</span>
                    <span>💕</span>
                    <span>💗</span>
                    <span>💘</span>
                    <span>💝</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
