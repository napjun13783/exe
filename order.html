<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สั่งซื้อสินค้า | Room Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 600px;">
    <h2>แบบฟอร์มสั่งซื้อ</h2>
    <form id="orderForm">
      <div class="form-group">
        <label>ชื่อลูกค้า</label>
        <input type="text" id="customerName" required>
      </div>
      <div class="form-group">
        <label>เบอร์โทรศัพท์ / Line ID</label>
        <input type="text" id="contact" required>
      </div>
      <div class="form-group">
        <label>รายการสินค้า</label>
        <input type="text" id="items" readonly style="background:#f9f9f9;">
      </div>
      <div class="form-group">
        <label>จำนวนเงินรวม (บาท)</label>
        <input type="number" id="total" readonly style="background:#f9f9f9;">
      </div>
      <div class="form-group">
        <label>หมายเหตุ (ถ้ามี)</label>
        <textarea id="note" rows="3"></textarea>
      </div>
      <button type="submit" class="btn" style="width:100%; background:var(--text-main); color:#fff;">ยืนยันสั่งซื้อ</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
